name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    # Legacy Workshop 8 needs pkg_resources from setuptools<81.
    # The native job below verifies the current OVOS stack.
    name: unit (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check whether runtime tests are needed
        id: scope
        run: python3 .github/scripts/ci_scope.py
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
        if: steps.scope.outputs.run_tests == 'true'
        id: python
      - name: Cache dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{
            hashFiles('pyproject.toml', 'setup.py', 'setup.cfg', '**/requirements*.txt', 'uv.lock',
            '.github/workflows/*.yml') }}
        if: steps.scope.outputs.run_tests == 'true'
      - run: pip install -e '.[test]' 'ovos-workshop==8.0.0' 'setuptools<81'
        if: steps.scope.outputs.run_tests == 'true'
      - run: pytest test/ --ignore=test/end2end -v

        if: steps.scope.outputs.run_tests == 'true'
    timeout-minutes: 20
  end-to-end:
    # Boots a real ovos-core through ovoscope. This is the layer that catches a
    # skill which passes unit tests and cannot be loaded at all — the failure
    # that once took every intent in a package down with it. It needs
    # pre-release OVOS intent engines, so it runs on one Python rather than all.
    name: end-to-end (real ovos-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check whether runtime tests are needed
        id: scope
        run: python3 .github/scripts/ci_scope.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        if: steps.scope.outputs.run_tests == 'true'
        id: python
      - name: Cache dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{
            hashFiles('pyproject.toml', 'setup.py', 'setup.cfg', '**/requirements*.txt', 'uv.lock',
            '.github/workflows/*.yml') }}
        if: steps.scope.outputs.run_tests == 'true'
      - run: pip install --pre -e '.[test,e2e]'
        if: steps.scope.outputs.run_tests == 'true'
      - run: pytest test/end2end -v

        if: steps.scope.outputs.run_tests == 'true'
    timeout-minutes: 20
  package:
    # A wheel that builds but ships no locale directory speaks dialog
    # identifiers at people, and nothing else here would notice.
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        id: python
      - name: Cache dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{
            hashFiles('pyproject.toml', 'setup.py', 'setup.cfg', '**/requirements*.txt', 'uv.lock',
            '.github/workflows/*.yml') }}
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: every locale is in the wheel
        run: |
          python - <<'PY'
          import glob, pathlib, zipfile, sys
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          shipped = {
              pathlib.PurePosixPath(n).parts[-3]
              for n in zipfile.ZipFile(wheel).namelist()
              if n.endswith(".dialog")
          }
          on_disk = {
              p.name
              for p in pathlib.Path("thalovant_skill_custos_fallback/locale").iterdir()
              if p.is_dir()
          }
          missing = on_disk - shipped
          print(f"{len(shipped)} locales in {wheel}")
          if missing:
              sys.exit(f"locales missing from the wheel: {sorted(missing)}")
          PY
    timeout-minutes: 20
